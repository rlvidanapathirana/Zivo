<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" fill="none">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f0f17" />
      <stop offset="50%" stop-color="#18132b" />
      <stop offset="100%" stop-color="#090514" />
    </linearGradient>
    <linearGradient id="iconGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#a855f7" />
      <stop offset="50%" stop-color="#c084fc" />
      <stop offset="100%" stop-color="#ec4899" />
    </linearGradient>
    <linearGradient id="glowGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#7c3aed" stop-opacity="0.6" />
      <stop offset="100%" stop-color="#f472b6" stop-opacity="0.2" />
    </linearGradient>
    <filter id="neonGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="16" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Base Rounded Container -->
  <rect width="512" height="512" rx="128" fill="url(#bgGrad)" />
  
  <!-- Outer Glowing Aura Ring -->
  <rect x="24" y="24" width="464" height="464" rx="104" stroke="url(#glowGrad)" stroke-width="8" fill="none" />
  
  <!-- Glow Behind Play Icon -->
  <polygon points="210,146 370,256 210,366" fill="url(#iconGrad)" filter="url(#neonGlow)" opacity="0.7" />
  
  <!-- Main Glowing Play Triangle -->
  <polygon points="210,146 370,256 210,366" fill="url(#iconGrad)" rx="16" />
</svg>